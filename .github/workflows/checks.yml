name: Application checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m compileall -q app
      - name: Check the dashboard and health endpoints
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          from unittest.mock import patch
          from urllib.parse import parse_qs, urlsplit

          from fastapi.testclient import TestClient

          from app.main import app

          with TestClient(app, base_url="http://localhost:8000") as client:
              health = client.get("/health")
              assert health.status_code == 200, health.text
              assert health.json()["status"] == "running"

              dashboard = client.get("/")
              assert dashboard.status_code == 200, dashboard.text
              assert "JobApply Mailer" in dashboard.text

              stats = client.get("/api/stats")
              assert stats.status_code == 200, stats.text
              assert stats.json()["total_contacts"] == 0

              oauth_config = json.dumps({"web": {"client_id": "test-client", "client_secret": "test-secret"}})
              with patch.dict(os.environ, {"GOOGLE_CLIENT_SECRET_JSON": oauth_config}):
                  status = client.get("/api/auth/google/status")
                  assert status.json()["client_secret_exists"]

                  login = client.get("/api/auth/google/login", follow_redirects=False)
                  assert login.status_code == 307, login.text
                  state = parse_qs(urlsplit(login.headers["location"]).query)["state"][0]
                  assert state

                  callback = "/api/auth/google/callback"
                  with patch("app.main.exchange_code_for_token", return_value={"email": "user@example.com"}) as exchange:
                      assert client.get(callback, params={"code": "test"}).status_code == 400
                      assert client.get(callback, params={"code": "test", "state": "wrong"}).status_code == 400
                      exchange.assert_not_called()

                      response = client.get(callback, params={"code": "test", "state": state}, follow_redirects=False)
                      assert response.status_code == 307, response.text
                      assert "google_success=1" in response.headers["location"]
                      exchange.assert_called_once()
                      assert client.get(callback, params={"code": "test", "state": state}).status_code == 400
          PY
